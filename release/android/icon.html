<!doctype html><meta charset="utf-8">
<!--
  The TimeSplitters 2 launcher icon (icon.png), drawn in the style of the
  game's logo: no game artwork is used. The lettering is Cinzel Decorative
  Bold (fonts/, SIL Open Font License). Render at 512x512 with:

    "Google Chrome" --headless=new --allow-file-access-from-files \
      --default-background-color=00000000 --window-size=512,512 \
      --virtual-time-budget=2000 --screenshot=icon.png "file://$PWD/icon.html"

  (?bg=dark for the dark tile.)
-->
<style>
@font-face{font-family:CDB;src:url(fonts/CinzelDecorative-Bold.ttf)}
html,body{margin:0;background:transparent}
svg{display:block}
</style>
<body>
<svg id="s" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9480f"/><stop offset=".45" stop-color="#f08c00"/><stop offset="1" stop-color="#ffd43b"/>
  </linearGradient>
  <linearGradient id="fire2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8590c"/><stop offset=".5" stop-color="#fab005"/><stop offset="1" stop-color="#ffe066"/>
  </linearGradient>
  <linearGradient id="ice" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#1c3f9e"/><stop offset=".45" stop-color="#3b6fd1"/><stop offset=".8" stop-color="#a5c4ef"/><stop offset="1" stop-color="#eef4fc"/>
  </linearGradient>
  <radialGradient id="bgL" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".75" stop-color="#eef1f5"/><stop offset="1" stop-color="#cfd6df"/></radialGradient>
  <radialGradient id="bgD" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#1d2a44"/><stop offset=".7" stop-color="#0d1424"/><stop offset="1" stop-color="#05080f"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
  <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="96"/></clipPath>
</defs>
<g clip-path="url(#tile)">
  <rect id="bg" x="0" y="0" width="512" height="512" fill="url(#bgL)"/>
  <circle cx="256" cy="262" r="214" fill="none" stroke="#9aa5b4" stroke-width="2" stroke-opacity=".55"/>
  <!-- the blue 2: a ribbon, behind the words -->
  <g filter="url(#sh)">
    <path d="M 214 132 C 250 74, 360 66, 384 128 C 408 192, 330 262, 262 322 C 214 364, 168 404, 132 446 L 392 446 C 404 446, 414 438, 420 426"
          fill="none" stroke="url(#ice)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 226 124 C 262 84, 350 82, 370 132 C 388 184, 322 250, 256 310 C 210 352, 172 392, 146 424"
          fill="none" stroke="#eef4fc" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- TIME -->
  <text x="262" y="226" text-anchor="middle" font-family="CDB" font-size="118" letter-spacing="-3" fill="url(#fire)" stroke="#7a2405" stroke-width="2" paint-order="stroke" filter="url(#sh)">TIME</text>
  <!-- SPLITTERS, condensed -->
  <g transform="translate(256 336) scale(0.66 1)">
    <text x="0" y="0" text-anchor="middle" font-family="CDB" font-size="104" letter-spacing="-5" fill="url(#fire2)" stroke="#7a2405" stroke-width="2.6" paint-order="stroke" filter="url(#sh)"><tspan font-size="136">S</tspan>PLITTER<tspan font-size="136">S</tspan></text>
  </g>
</g>
<rect x="16.5" y="16.5" width="479" height="479" rx="95.5" fill="none" stroke="#000" stroke-opacity=".18"/>
</svg>
<script>
const p=new URLSearchParams(location.search);
if(p.get('bg')==='dark'){document.getElementById('bg').setAttribute('fill','url(#bgD)');}
</script>
