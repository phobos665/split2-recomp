# A self-building release on every version tag (git tag v1.0 && git push
# origin v1.0): the launcher, the toolkit's pipeline, a pinned compiler and
# this repository's sources, as split2-<tag>-linux-x86_64.tar.xz and
# split2-<tag>-macos-arm64.tar.xz on the tag's GitHub release. The player
# points the launcher at their own disc and it builds the game on their
# machine (DirectXbox-Recomp's docs/technical/self-build-release.md).
#
# No game files are involved anywhere: the release holds no lifted code and
# nothing here lifts, builds or starts the game.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (a dry run: nothing is published)"
        default: "dev"

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The toolkit, and of its submodules only what the release builds.
      - name: Fetch the toolkit
        run: |
          git submodule update --init --depth 1 xboxrecomp
          git -C xboxrecomp submodule update --init --depth 1 \
            third_party/SDL third_party/Vulkan-Headers \
            third_party/volk third_party/VulkanMemoryAllocator \
            third_party/libsamplerate third_party/miniupnp
          git -C xboxrecomp submodule update --init --recursive --depth 1 \
            third_party/XbSymbolDatabase

      # The release's zig compiles against its own glibc headers; these are
      # what SDL loads at run time, searched after them.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libudev-dev \
            libfreetype-dev libfontconfig-dev

      - name: Fetch DXC
        run: bash xboxrecomp/tools/linux/fetch_dxc.sh

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/downloads
          key: release-downloads-${{ hashFiles('xboxrecomp/tools/release/fetch_toolchain.py') }}

      - name: Make the release
        working-directory: xboxrecomp
        run: |
          python3 -m tools.release.make_release ../release/split2.json \
            --out "$RUNNER_TEMP/release/split2" --work "$RUNNER_TEMP/work" \
            --cache "$RUNNER_TEMP/downloads" --version "$VERSION" --archive

      - uses: actions/upload-artifact@v4
        with:
          name: split2-${{ env.VERSION }}-linux-x86_64
          path: ${{ runner.temp }}/release/*.tar.xz
          retention-days: 3

  # An application, TimeSplitters 2.app, for Apple Silicon. The player needs
  # no Xcode: zig builds the game. SDL and the launcher are built here with
  # Xcode, and the Vulkan loader, MoltenVK and DXC come from LunarG's SDK.
  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the toolkit
        run: |
          git submodule update --init --depth 1 xboxrecomp
          git -C xboxrecomp submodule update --init --depth 1 \
            third_party/SDL third_party/Vulkan-Headers \
            third_party/volk third_party/VulkanMemoryAllocator \
            third_party/libsamplerate third_party/miniupnp
          git -C xboxrecomp submodule update --init --recursive --depth 1 \
            third_party/XbSymbolDatabase

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vulkan-sdk-downloads
          key: vulkan-sdk-${{ hashFiles('xboxrecomp/tools/macos/fetch_vulkan_sdk.sh') }}

      - name: Fetch the Vulkan SDK
        run: |
          bash xboxrecomp/tools/macos/fetch_vulkan_sdk.sh "$RUNNER_TEMP/VulkanSDK" \
            "$RUNNER_TEMP/vulkan-sdk-downloads" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/downloads
          key: release-downloads-macos-${{ hashFiles('xboxrecomp/tools/release/fetch_toolchain.py') }}

      - name: Make the release
        working-directory: xboxrecomp
        run: |
          python3 -m tools.release.make_release ../release/split2.json \
            --out "$RUNNER_TEMP/release/split2" --work "$RUNNER_TEMP/work" \
            --cache "$RUNNER_TEMP/downloads" --version "$VERSION" --archive

      - uses: actions/upload-artifact@v4
        with:
          name: split2-${{ env.VERSION }}-macos-arm64
          path: ${{ runner.temp }}/release/*.tar.xz
          retention-days: 3

  # One job publishes, once both are built, so a tag never gets half a release.
  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l archives
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --title "$VERSION" --verify-tag \
              --notes "Point the launcher at your own copy of TimeSplitters 2 (PAL or USA) and it builds the game on your machine, once. Linux: unpack split2-$VERSION-linux-x86_64.tar.xz and run ./split2. Mac (Apple Silicon, macOS 13 or later): unpack split2-$VERSION-macos-arm64.tar.xz, move TimeSplitters 2.app to Applications, and before opening it the first time run xattr -dr com.apple.quarantine \"/Applications/TimeSplitters 2.app\" in Terminal (it is not signed with an Apple Developer ID). See README.txt inside."
          gh release upload "$VERSION" archives/*.tar.xz --clobber
