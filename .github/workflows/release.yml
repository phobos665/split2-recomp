# A self-building release on every version tag (git tag v1.0 && git push
# origin v1.0): the launcher, the toolkit's pipeline, a pinned compiler and
# this repository's sources, as split2-<tag>-linux-x86_64.tar.xz on the
# tag's GitHub release. The player points the launcher at their own disc and
# it builds the game on their machine (xboxrecomp
# docs/technical/self-build-release.md).
#
# No game files are involved anywhere: the release holds no lifted code and
# nothing here lifts, builds or starts the game.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (a dry run: nothing is published)"
        default: "dev"

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The toolkit, and of its submodules only what the release builds.
      - name: Fetch the toolkit
        run: |
          git submodule update --init --depth 1 xboxrecomp
          git -C xboxrecomp submodule update --init --depth 1 \
            third_party/SDL third_party/Vulkan-Headers \
            third_party/volk third_party/VulkanMemoryAllocator \
            third_party/libsamplerate third_party/miniupnp
          git -C xboxrecomp submodule update --init --recursive --depth 1 \
            third_party/XbSymbolDatabase

      # The release's zig compiles against its own glibc headers; these are
      # what SDL loads at run time, searched after them.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libudev-dev \
            libfreetype-dev libfontconfig-dev

      - name: Fetch DXC
        run: bash xboxrecomp/tools/linux/fetch_dxc.sh

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/downloads
          key: release-downloads-${{ hashFiles('xboxrecomp/tools/release/fetch_toolchain.py') }}

      - name: Make the release
        working-directory: xboxrecomp
        run: |
          python3 -m tools.release.make_release ../release/split2.json \
            --out "$RUNNER_TEMP/release/split2" --work "$RUNNER_TEMP/work" \
            --cache "$RUNNER_TEMP/downloads" --version "$VERSION" --archive

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/release/split2-$VERSION-linux-x86_64.tar.xz"
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --title "$VERSION" --verify-tag \
              --notes "Unpack it, run ./split2, and point it at your own copy of TimeSplitters 2 (PAL or USA): it builds the game on your machine, once. See README.txt inside."
          gh release upload "$VERSION" "$archive" --clobber

      - name: Keep the dry run's archive
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: split2-${{ env.VERSION }}-linux-x86_64
          path: ${{ runner.temp }}/release/*.tar.xz
          retention-days: 3
